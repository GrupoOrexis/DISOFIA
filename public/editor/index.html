<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Editor · DISOFIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0F172A; --navy2:#1E293B; --unav:#8B1E24; --unav-dark:#6C151A;
    --cream:#FAF9F5; --stone:#78716c; --stone-200:#e7e5e4; --stone-300:#d6d3d1;
    --ok:#15803d; --err:#b91c1c;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--cream);color:#1c1917}
  a{color:var(--unav)}
  /* Topbar */
  header.top{position:sticky;top:0;z-index:50;background:var(--navy);color:#f5f5f4;display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:3px solid var(--unav);flex-wrap:wrap}
  header.top .brand{font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:700;letter-spacing:.06em}
  header.top .ref{font-family:"Space Mono",monospace;font-size:11px;color:#a8a29e;border:1px solid #44403c;padding:2px 8px;border-radius:4px}
  header.top .spacer{flex:1}
  .btn{font-family:inherit;font-size:14px;font-weight:600;border:none;border-radius:8px;padding:9px 16px;cursor:pointer;transition:.15s}
  .btn-primary{background:var(--unav);color:#fff}
  .btn-primary:hover{background:var(--unav-dark)}
  .btn-primary:disabled{background:#57534e;cursor:not-allowed}
  .btn-ghost{background:transparent;color:#e7e5e4;border:1px solid #44403c}
  .btn-ghost:hover{background:#1c2536}
  .status{font-size:13px;font-weight:600;min-width:10px}
  .status.ok{color:#86efac}.status.err{color:#fca5a5}.status.info{color:#cbd5e1}
  /* Layout */
  .wrap{display:flex;max-width:1200px;margin:0 auto;gap:28px;padding:24px 20px 80px}
  nav.side{flex:0 0 220px;position:sticky;top:84px;align-self:flex-start;display:flex;flex-direction:column;gap:4px}
  nav.side button{text-align:left;background:transparent;border:none;border-left:3px solid transparent;padding:10px 14px;font:inherit;font-size:14px;color:#44403c;cursor:pointer;border-radius:0 6px 6px 0}
  nav.side button:hover{background:#fff}
  nav.side button.active{background:#fff;border-left-color:var(--unav);color:var(--unav);font-weight:700}
  main.panel{flex:1;min-width:0}
  h2.sec{font-family:"Cormorant Garamond",serif;font-size:30px;font-weight:700;margin:0 0 4px;color:var(--navy)}
  .sec-desc{color:var(--stone);font-size:14px;margin:0 0 22px}
  /* Fields */
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;font-weight:600;color:#44403c;margin-bottom:5px}
  .field input[type=text],.field input[type=number],.field textarea,.field select{
    width:100%;font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--stone-300);border-radius:7px;background:#fff;color:#1c1917}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--unav);box-shadow:0 0 0 3px rgba(139,30,36,.12)}
  .field textarea{min-height:90px;resize:vertical;line-height:1.5}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .subgroup{border:1px solid var(--stone-200);border-radius:10px;padding:16px;margin-bottom:16px;background:#fcfbf9}
  .subgroup h4{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--unav)}
  .chk{display:flex;align-items:center;gap:8px}
  .chk input{width:18px;height:18px;accent-color:var(--unav)}
  /* Tags */
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .tag{background:#f5f5f4;border:1px solid var(--stone-200);border-radius:14px;padding:4px 10px;font-size:13px;display:flex;align-items:center;gap:6px}
  .tag button{border:none;background:none;color:var(--unav);cursor:pointer;font-size:15px;line-height:1;padding:0}
  .tag-add{display:flex;gap:8px}
  .tag-add input{flex:1}
  .tag-add button{flex:0 0 auto}
  /* Array cards */
  .card{border:1px solid var(--stone-200);border-radius:12px;background:#fff;margin-bottom:18px;overflow:hidden}
  .card-head{display:flex;align-items:center;gap:10px;background:#f7f6f3;padding:10px 14px;border-bottom:1px solid var(--stone-200)}
  .card-head .idx{font-family:"Space Mono",monospace;font-size:12px;color:var(--unav);font-weight:700}
  .card-head .ttl{font-weight:600;font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-head button{border:none;background:transparent;cursor:pointer;color:#78716c;font-size:15px;padding:4px 7px;border-radius:6px}
  .card-head button:hover{background:#e7e5e4;color:var(--unav)}
  .card-body{padding:16px}
  .btn-add{background:#fff;border:1.5px dashed var(--unav);color:var(--unav);width:100%;padding:12px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
  .btn-add:hover{background:#fdf2f2}
  /* Token panel */
  .tokenbar{background:#fffdf7;border:1px solid #f0e6c8;border-radius:10px;padding:14px 16px;margin-bottom:22px;font-size:13.5px;color:#57534e}
  .tokenbar .row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .tokenbar input{flex:1;min-width:220px;font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--stone-300);border-radius:7px}
  .tokenbar .mono{font-family:"Space Mono",monospace;font-size:12px}
  .pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:12px}
  .pill.on{background:#dcfce7;color:#15803d}.pill.off{background:#fee2e2;color:#b91c1c}
  .loading{text-align:center;padding:60px;color:var(--stone)}
  @media(max-width:820px){.wrap{flex-direction:column}nav.side{position:static;flex-direction:row;flex-wrap:wrap}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <span class="brand">DISOFIA</span>
  <span class="ref">EDITOR DE CONTENIDOS</span>
  <span class="spacer"></span>
  <span id="status" class="status info"></span>
  <button id="reloadBtn" class="btn btn-ghost" type="button">Recargar</button>
  <button id="saveBtn" class="btn btn-primary" type="button" disabled>Guardar y publicar</button>
</header>

<div id="tokenMount" style="max-width:1200px;margin:0 auto;padding:18px 20px 0"></div>

<div class="wrap">
  <nav class="side" id="sidebar"></nav>
  <main class="panel" id="panel">
    <div class="loading" id="loading">Cargando contenido…</div>
  </main>
</div>

<script>
const CFG = { owner:'MiQ-88', repo:'DISOFIA', branch:'main', path:'src/content.json' };
const API = `https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/${CFG.path}`;

const state = { token: localStorage.getItem('disofia_gh_token')||'', data:null, sha:null, current:null, dirty:false };

// ---------- utils ----------
const $ = (s,el=document)=>el.querySelector(s);
const el = (tag, attrs={}, ...kids)=>{const n=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==='class')n.className=v;else if(k==='html')n.innerHTML=v;else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);else if(v!=null)n.setAttribute(k,v);}for(const k of kids)n.append(k);return n;};
const getPath=(o,p)=>p.split('.').reduce((a,k)=>a?.[k],o);
const setPath=(o,p,v)=>{const ks=p.split('.');const last=ks.pop();let t=o;for(const k of ks){t[k]=t[k]??{};t=t[k];}t[last]=v;};
function utf8ToB64(str){const bytes=new TextEncoder().encode(str);let bin='';const chunk=0x8000;for(let i=0;i<bytes.length;i+=chunk)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));return btoa(bin);}
function b64ToUtf8(b64){const bin=atob(b64.replace(/\s/g,''));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes);}
function setStatus(msg,kind='info'){const s=$('#status');s.textContent=msg;s.className='status '+kind;}
function markDirty(){state.dirty=true;$('#saveBtn').disabled=!state.token;}

// ---------- schema ----------
const REGIONS=['España','Europa','Norteamérica','Latinoamérica','Asia'];
const CATEGORIES=['Investigador en Formación / Predoc','Colaborador Internacional'];
const READ_TYPES=['Monografía','Estudio Exegético','Clásico / Ejercicios','Traducción y Seminario'];
const WS_STATUS=['Confirmado','En preparación'];

const SECTIONS=[
  {key:'metadata',label:'Proyecto',kind:'object',fields:[
    {k:'title',label:'Título',t:'text',full:true},
    {k:'subtitle',label:'Subtítulo',t:'textarea',full:true},
    {k:'acronym',label:'Acrónimo',t:'text'},{k:'reference',label:'Referencia',t:'text'},
    {k:'modality',label:'Modalidad',t:'text'},{k:'period',label:'Periodo',t:'text'},
    {k:'startDate',label:'Fecha inicio',t:'text'},{k:'endDate',label:'Fecha fin',t:'text'},
    {k:'area',label:'Área',t:'text',full:true},
    {k:'executingEntity',label:'Entidad ejecutora',t:'text'},{k:'faculty',label:'Facultad',t:'text'},
    {k:'department',label:'Departamento',t:'text'},{k:'fundingEntity',label:'Entidad financiadora',t:'text'},
    {k:'fundingCode',label:'Código de financiación',t:'text'},{k:'coFinancing',label:'Cofinanciación',t:'text'},
    {k:'executiveSummary',label:'Resumen ejecutivo',t:'textarea',full:true},
  ],groups:[
    {title:'Resultados previstos',fields:[
      {k:'plannedOutputs.articles',label:'Artículos',t:'text'},{k:'plannedOutputs.monographs',label:'Monografías',t:'text'},
      {k:'plannedOutputs.collectiveVolume',label:'Volumen colectivo',t:'text'},{k:'plannedOutputs.translation',label:'Traducción',t:'text'},
    ]},
    {title:'Indicadores',fields:[
      {k:'indicators.workTeamTotal',label:'Equipo (total)',t:'number'},{k:'indicators.men',label:'Hombres',t:'number'},
      {k:'indicators.women',label:'Mujeres',t:'number'},{k:'indicators.phdTheses',label:'Tesis doctorales',t:'number'},
      {k:'indicators.indexedPublications',label:'Publicaciones indexadas',t:'number'},
    ]},
  ]},
  {key:'researchLines',label:'Líneas de investigación',kind:'array',titleField:'title',fields:[
    {k:'number',label:'Número',t:'text'},{k:'title',label:'Título',t:'text',full:true},
    {k:'shortDescription',label:'Descripción breve',t:'textarea',full:true},
    {k:'extendedDescription',label:'Descripción extendida',t:'textarea',full:true},
    {k:'keyConcepts',label:'Conceptos clave',t:'tags',full:true},
    {k:'philosophicalQuestions',label:'Preguntas filosóficas',t:'tags',full:true},
    {k:'id',label:'ID (interno)',t:'text'},
  ]},
  {key:'principalInvestigators',label:'Investigadores principales',kind:'array',titleField:'name',fields:[
    {k:'name',label:'Nombre',t:'text'},{k:'title',label:'Tratamiento',t:'text'},
    {k:'academicPosition',label:'Posición académica',t:'text',full:true},
    {k:'role',label:'Rol',t:'text'},{k:'specialty',label:'Especialidad',t:'text',full:true},
    {k:'email',label:'Email',t:'text'},{k:'orcid',label:'ORCID',t:'text'},{k:'orcidUrl',label:'URL ORCID',t:'text',full:true},
    {k:'institution',label:'Institución',t:'text'},{k:'institutionShort',label:'Institución (abrev.)',t:'text'},
    {k:'location',label:'Ubicación',t:'text'},
  ]},
  {key:'researchTeam',label:'Equipo de investigación',kind:'array',titleField:'name',fields:[
    {k:'name',label:'Nombre',t:'text'},{k:'role',label:'Rol',t:'text'},
    {k:'institution',label:'Institución',t:'text'},{k:'institutionShort',label:'Institución (abrev.)',t:'text'},
    {k:'location',label:'Ubicación',t:'text'},{k:'specialty',label:'Especialidad',t:'text',full:true},
    {k:'orcid',label:'ORCID',t:'text'},{k:'orcidUrl',label:'URL ORCID',t:'text'},
  ]},
  {key:'workTeam',label:'Red internacional',kind:'array',titleField:'name',fields:[
    {k:'name',label:'Nombre',t:'text',full:true},
    {k:'institution',label:'Institución',t:'text'},{k:'institutionShort',label:'Institución (abrev.)',t:'text'},
    {k:'country',label:'País',t:'text'},{k:'flag',label:'Bandera (emoji)',t:'text'},
    {k:'region',label:'Región',t:'select',options:REGIONS},
    {k:'category',label:'Categoría',t:'select',options:CATEGORIES},
    {k:'gender',label:'Género',t:'select',options:['M','F']},
    {k:'isPhdCandidate',label:'¿Doctorando?',t:'checkbox'},
  ]},
  {key:'inauguralSession',label:'Seminario inaugural',kind:'object',fields:[
    {k:'title',label:'Título',t:'text',full:true},
    {k:'date',label:'Fecha (texto)',t:'text'},{k:'isoDate',label:'Fecha ISO',t:'text'},
    {k:'durationHours',label:'Duración (horas)',t:'number'},{k:'time',label:'Hora',t:'text'},
    {k:'location',label:'Lugar',t:'text'},{k:'room',label:'Sala',t:'text'},
    {k:'book',label:'Libro',t:'text',full:true},{k:'publisherYear',label:'Editorial y año',t:'text'},
    {k:'speaker',label:'Ponente',t:'text'},{k:'speakerAffiliation',label:'Afiliación del ponente',t:'text',full:true},
    {k:'description',label:'Descripción',t:'textarea',full:true},
  ]},
  {key:'readingList',label:'Lecturas',kind:'array',titleField:'title',fields:[
    {k:'author',label:'Autor',t:'text'},{k:'title',label:'Título',t:'text',full:true},
    {k:'editorial',label:'Editorial',t:'text'},{k:'year',label:'Año',t:'text'},
    {k:'type',label:'Tipo',t:'select',options:READ_TYPES},
    {k:'notes',label:'Notas',t:'textarea',full:true},{k:'id',label:'ID (interno)',t:'text'},
  ]},
  {key:'workshops',label:'Talleres',kind:'array',titleField:'title',fields:[
    {k:'edition',label:'Edición',t:'text'},{k:'title',label:'Título',t:'text',full:true},
    {k:'topic',label:'Tema',t:'text',full:true},{k:'date',label:'Fecha',t:'text'},
    {k:'location',label:'Lugar',t:'text'},{k:'status',label:'Estado',t:'select',options:WS_STATUS},
    {k:'id',label:'ID (interno)',t:'text'},
  ]},
];

// ---------- field rendering ----------
function renderField(obj,f){
  const wrap=el('div',{class:'field'+(f.full?' full':'')});
  wrap.style.gridColumn=f.full?'1 / -1':'';
  wrap.append(el('label',{},f.label));
  let input;
  const val=getPath(obj,f.k);
  if(f.t==='textarea'){input=el('textarea',{oninput:e=>{setPath(obj,f.k,e.target.value);markDirty();}});input.value=val??'';}
  else if(f.t==='number'){input=el('input',{type:'number',oninput:e=>{setPath(obj,f.k,e.target.value===''?null:Number(e.target.value));markDirty();}});input.value=val??'';}
  else if(f.t==='select'){input=el('select',{onchange:e=>{setPath(obj,f.k,e.target.value);markDirty();}});for(const o of f.options)input.append(el('option',{value:o,...(o===val?{selected:''}:{})},o));if(val==null)setPath(obj,f.k,f.options[0]);}
  else if(f.t==='checkbox'){const cb=el('input',{type:'checkbox',onchange:e=>{setPath(obj,f.k,e.target.checked);markDirty();}});if(val)cb.checked=true;wrap.querySelector('label').remove();wrap.append(el('div',{class:'chk'},cb,el('span',{},f.label)));return wrap;}
  else if(f.t==='tags'){return renderTags(obj,f);}
  else {input=el('input',{type:'text',oninput:e=>{setPath(obj,f.k,e.target.value);markDirty();}});input.value=val??'';}
  wrap.append(input);
  return wrap;
}
function renderTags(obj,f){
  const wrap=el('div',{class:'field full'});wrap.style.gridColumn='1 / -1';
  wrap.append(el('label',{},f.label));
  const list=el('div',{class:'tags'});
  const arr=()=>{let a=getPath(obj,f.k);if(!Array.isArray(a)){a=[];setPath(obj,f.k,a);}return a;};
  const draw=()=>{list.innerHTML='';arr().forEach((t,i)=>{list.append(el('span',{class:'tag'},t,el('button',{type:'button',onclick:()=>{arr().splice(i,1);markDirty();draw();}},'×')));});};
  draw();
  const inp=el('input',{type:'text',placeholder:'Añadir y pulsar Enter',onkeydown:e=>{if(e.key==='Enter'){e.preventDefault();const v=e.target.value.trim();if(v){arr().push(v);e.target.value='';markDirty();draw();}}}});
  const add=el('button',{class:'btn btn-ghost',type:'button',style:'color:var(--unav);border-color:var(--stone-300)',onclick:()=>{const v=inp.value.trim();if(v){arr().push(v);inp.value='';markDirty();draw();}}},'Añadir');
  wrap.append(list,el('div',{class:'tag-add'},inp,add));
  return wrap;
}
function fieldsGrid(obj,fields){const g=el('div',{class:'grid2'});for(const f of fields)g.append(renderField(obj,f));return g;}

// ---------- section rendering ----------
function renderSection(sec){
  const panel=$('#panel');panel.innerHTML='';
  panel.append(el('h2',{class:'sec'},sec.label));
  panel.append(el('p',{class:'sec-desc'},sec.kind==='array'?`${(state.data[sec.key]||[]).length} elemento(s). Edita, añade, elimina o reordena.`:'Edita los campos y pulsa «Guardar y publicar».'));
  if(sec.kind==='object'){
    const obj=state.data[sec.key];
    panel.append(fieldsGrid(obj,sec.fields));
    (sec.groups||[]).forEach(gr=>{const box=el('div',{class:'subgroup'});box.append(el('h4',{},gr.title));box.append(fieldsGrid(obj,gr.fields));panel.append(box);});
  } else {
    const arr=state.data[sec.key]||(state.data[sec.key]=[]);
    const listEl=el('div',{});
    const drawList=()=>{
      listEl.innerHTML='';
      arr.forEach((item,i)=>{
        const head=el('div',{class:'card-head'},
          el('span',{class:'idx'},String(i+1).padStart(2,'0')),
          el('span',{class:'ttl'},item[sec.titleField]||'(sin título)'),
          el('button',{type:'button',title:'Subir',onclick:()=>{if(i>0){[arr[i-1],arr[i]]=[arr[i],arr[i-1]];markDirty();drawList();}}},'↑'),
          el('button',{type:'button',title:'Bajar',onclick:()=>{if(i<arr.length-1){[arr[i+1],arr[i]]=[arr[i],arr[i+1]];markDirty();drawList();}}},'↓'),
          el('button',{type:'button',title:'Eliminar',onclick:()=>{if(confirm('¿Eliminar este elemento?')){arr.splice(i,1);markDirty();drawList();}}},'🗑')
        );
        const body=el('div',{class:'card-body'});body.append(fieldsGrid(item,sec.fields));
        // live-update card title
        const titleInput=body.querySelector('input,textarea');
        body.addEventListener('input',()=>{head.querySelector('.ttl').textContent=item[sec.titleField]||'(sin título)';});
        listEl.append(el('div',{class:'card'},head,body));
      });
    };
    drawList();
    const addBtn=el('button',{class:'btn-add',type:'button',onclick:()=>{const o={};sec.fields.forEach(f=>{o[f.k]=f.t==='tags'?[]:(f.t==='checkbox'?false:(f.t==='select'?f.options[0]:''));});if(o.id!==undefined)o.id=sec.key.slice(0,3)+'-'+Date.now();arr.push(o);markDirty();drawList();}},'+ Añadir elemento');
    panel.append(listEl,addBtn);
  }
}

function renderSidebar(){
  const sb=$('#sidebar');sb.innerHTML='';
  SECTIONS.forEach(sec=>{
    const b=el('button',{type:'button',onclick:()=>{state.current=sec.key;renderSidebar();renderSection(sec);window.scrollTo(0,0);}},sec.label);
    if(sec.key===state.current)b.classList.add('active');
    sb.append(b);
  });
}

// ---------- token panel ----------
function renderTokenBar(){
  const bar=el('div',{class:'tokenbar'});
  const connected=!!state.token;
  bar.append(el('div',{html:`<strong>Publicación.</strong> Para guardar los cambios en la web necesitas un <em>token</em> personal de GitHub (permiso de solo este repositorio, Contents: lectura y escritura). Se guarda únicamente en este navegador. <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Crear token →</a>`}));
  const row=el('div',{class:'row'});
  const pill=el('span',{class:'pill '+(connected?'on':'off')},connected?'Token guardado':'Sin token');
  const inp=el('input',{type:'password',placeholder:'Pega aquí tu token (github_pat_…)',value:state.token});
  const save=el('button',{class:'btn btn-primary',type:'button',style:'padding:8px 14px',onclick:()=>{state.token=inp.value.trim();localStorage.setItem('disofia_gh_token',state.token);$('#saveBtn').disabled=!state.token;renderPanelTop();setStatus(state.token?'Token guardado':'Token borrado',state.token?'ok':'info');}},'Guardar token');
  const clear=el('button',{class:'btn btn-ghost',type:'button',style:'padding:8px 14px;color:var(--unav);border-color:var(--stone-300)',onclick:()=>{state.token='';localStorage.removeItem('disofia_gh_token');$('#saveBtn').disabled=true;renderPanelTop();}},'Borrar');
  row.append(pill,inp,save,clear);
  bar.append(row);
  return bar;
}
function renderPanelTop(){mountTokenBar();}
function mountTokenBar(){const m=$('#tokenMount');if(m){m.innerHTML='';m.append(renderTokenBar());}}

// ---------- GitHub I/O ----------
async function ghLoad(){
  setStatus('Cargando…','info');
  const headers={'Accept':'application/vnd.github+json'};
  if(state.token)headers['Authorization']='Bearer '+state.token;
  const r=await fetch(API+'?ref='+CFG.branch,{headers,cache:'no-store'});
  if(!r.ok)throw new Error('No se pudo cargar el contenido ('+r.status+')');
  const j=await r.json();
  state.sha=j.sha;
  state.data=JSON.parse(b64ToUtf8(j.content));
  state.dirty=false;
}
async function ghSave(){
  if(!state.token){setStatus('Falta el token','err');return;}
  $('#saveBtn').disabled=true;setStatus('Publicando…','info');
  try{
    // refresh sha to avoid conflicts
    const headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+state.token};
    const cur=await fetch(API+'?ref='+CFG.branch,{headers,cache:'no-store'});
    if(cur.ok){const cj=await cur.json();state.sha=cj.sha;}
    const body={message:'Editar contenido DISOFIA desde el editor visual',content:utf8ToB64(JSON.stringify(state.data,null,2)+'\n'),sha:state.sha,branch:CFG.branch};
    const r=await fetch(API,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.message||('Error '+r.status));}
    const j=await r.json();state.sha=j.content.sha;state.dirty=false;
    setStatus('✔ Publicado. La web se actualizará en 1–2 min.','ok');
  }catch(err){
    setStatus('✖ '+err.message,'err');$('#saveBtn').disabled=false;
  }
}

// ---------- init ----------
async function init(){
  try{
    await ghLoad();
    $('#loading').remove();
    mountTokenBar();
    state.current=SECTIONS[0].key;
    renderSidebar();renderSection(SECTIONS[0]);
    $('#saveBtn').disabled=!state.token;
    setStatus('Contenido cargado','ok');
  }catch(err){
    $('#loading').textContent='Error al cargar: '+err.message;
    setStatus(err.message,'err');
  }
}
$('#saveBtn').addEventListener('click',ghSave);
$('#reloadBtn').addEventListener('click',async()=>{if(state.dirty&&!confirm('Hay cambios sin guardar. ¿Recargar y descartarlos?'))return;location.reload();});
window.addEventListener('beforeunload',e=>{if(state.dirty){e.preventDefault();e.returnValue='';}});
init();
</script>
</body>
</html>
